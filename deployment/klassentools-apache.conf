# Only the two backend route prefixes; public demo assets remain static.
ProxyPass /klassentools/oidc/ unix:/run/klassentools/backend.sock|http://klassentools-backend/klassentools/oidc/ connectiontimeout=3 timeout=25
ProxyPassReverse /klassentools/oidc/ http://klassentools-backend/klassentools/oidc/
ProxyPass /klassentools/api/ unix:/run/klassentools/backend.sock|http://klassentools-backend/klassentools/api/ connectiontimeout=3 timeout=25
ProxyPassReverse /klassentools/api/ http://klassentools-backend/klassentools/api/
<LocationMatch "^/klassentools/(oidc|api)/">
    # Overwrite client-supplied values after trusted mod_remoteip processing.
    RequestHeader set X-KlassenTools-Client-IP "expr=%{REMOTE_ADDR}"
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
</LocationMatch>


# Public files may be retained, but must be revalidated before reuse.
# Query hashes are version hints; old URLs are not immutable content storage.
# API/OIDC paths never match this expression and retain no-store above.
<LocationMatch "^/klassentools/(?:[a-z][a-z0-9.-]*\.(?:html|css|js|mjs|png|webp))?$">
    Header always set Cache-Control "no-cache"
</LocationMatch>
