# Example security headers for KlassenTools only. Adapt the frame ancestor to your IServ.

<LocationMatch "^/klassentools(?:/|$)">
    Header onsuccess unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; worker-src 'none'; form-action 'self'; frame-ancestors 'self' https://school.example"
    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header onsuccess unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header onsuccess unset Permissions-Policy
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
</LocationMatch>
